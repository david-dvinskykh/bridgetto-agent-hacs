configuration:
  control_plane_url:
    name: Control plane URL
    description: HTTPS address of your Bridgetto control plane, e.g. https://bridgetto.example.com. The agent is downloaded from it.
  enroll_token:
    name: Enrollment token
    description: One-time token from the control plane (Servers → Add server). Used only on the first start.
  hub_url:
    name: Hub URL
    description: Optional. Overrides the hub address served by the control plane (wss://…).
  hub_ca_sha256:
    name: Hub certificate pin
    description: Optional. SHA-256 of the hub certificate or a CA in its chain, from the install command.
  org_id:
    name: Organization ID
    description: Optional. The agent refuses commands for other organizations.
  log_level:
    name: Log level
